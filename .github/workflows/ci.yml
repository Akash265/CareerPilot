name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: career_intel
          POSTGRES_PASSWORD: career_intel
          POSTGRES_DB: career_intel_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U career_intel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DEFAULT_USER_ID: 00000000-0000-0000-0000-000000000001
      # GitHub Actions `services:` containers don't run infra/postgres/init.sql
      # (no docker-entrypoint-initdb.d mount here, unlike infra/docker-compose.yml),
      # so the least-privilege `career_intel_app` role DATABASE_URL points at
      # doesn't exist until the "Provision career_intel_app role" step below
      # creates it. `career_intel` (POSTGRES_USER above) is the superuser role,
      # used here only for that provisioning step and for MIGRATIONS_DATABASE_URL
      # (DECISIONS.md D12/D13) -- app runtime code must never use it directly.
      DATABASE_URL: postgres://career_intel_app:career_intel_app@localhost:5432/career_intel_test
      MIGRATIONS_DATABASE_URL: postgres://career_intel:career_intel@localhost:5432/career_intel_test
      REDIS_URL: redis://localhost:6379
      MINIO_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      ANTHROPIC_API_KEY: sk-ant-ci-placeholder
      EMBEDDING_PROVIDER: voyage
      VOYAGE_API_KEY: ci-placeholder
      # Required since Phase 2 (packages/config/src/env.ts) -- role-based
      # model selection per DECISIONS.md D7, not a hardcoded version string.
      # No real API call is ever made in CI (Anthropic/Voyage clients are
      # mocked in every test that would otherwise need them), so these
      # placeholders only need to satisfy loadEnv()'s schema, not resolve to
      # real models.
      ANTHROPIC_MODEL_FAST: claude-haiku-4-5-20251001
      ANTHROPIC_MODEL_RESEARCH: claude-sonnet-5
      VOYAGE_EMBEDDING_MODEL: voyage-3.5
    steps:
      - uses: actions/checkout@v4
      - name: Start MinIO
        # MinIO isn't declared under `services:` like postgres/redis above
        # because GitHub Actions service containers cannot override a
        # container's command, and the official MinIO image's
        # entrypoint requires one (`server /data ...`) to actually start the
        # server -- without it the container just prints usage and never
        # becomes healthy. Run it as a plain background container instead,
        # using the same image as infra/docker-compose.yml, and poll its health
        # endpoint the same way postgres/redis's `--health-*` options do.
        # Image: minio/minio is gone from Docker Hub and quay.io/minio/minio now
        # answers anonymous pulls with 401, so both fail with exit 125. Chainguard's
        # MinIO build is anonymously pullable; its free tier only publishes `latest`,
        # so it is pinned by digest (DECISIONS.md D88). Its entrypoint is
        # /usr/bin/minio, so the `server /data ...` arguments are unchanged.
        run: |
          docker run -d --name minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=minioadmin \
            -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio@sha256:71674988a1c7ddd5724928633199152b11e4ddefd6c6ce2d60772ff4a8f22ca9 server /data --console-address ":9001"
          for i in $(seq 1 20); do
            if curl -sf http://localhost:9000/minio/health/live >/dev/null; then
              echo "MinIO is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "MinIO did not become healthy in time" >&2
          docker logs minio
          exit 1
      - uses: pnpm/action-setup@v4
        # No explicit `version:` here -- pnpm/action-setup@v4 auto-detects it
        # from package.json's "packageManager" field (pnpm@9.15.0). Setting
        # both makes the action refuse to run at all ("Multiple versions of
        # pnpm specified"), even when they don't actually conflict.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile
      - name: Enable pgvector/pg_trgm on test db
        run: |
          PGPASSWORD=career_intel psql -h localhost -U career_intel -d career_intel_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector; CREATE EXTENSION IF NOT EXISTS pg_trgm;"
      - name: Provision least-privilege career_intel_app role (DECISIONS.md D12/D13)
        # GitHub Actions services containers skip infra/postgres/init.sql entirely, so
        # the app-runtime role that DATABASE_URL points at must be created explicitly
        # here. This reuses the exact role-creation/grant SQL from
        # infra/postgres/init.sql's career_intel_test block (minus the \connect
        # dance, since this CI Postgres only ever has the one database).
        run: |
          PGPASSWORD=career_intel psql -h localhost -U career_intel -d career_intel_test <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'career_intel_app') THEN
              CREATE ROLE career_intel_app WITH LOGIN PASSWORD 'career_intel_app'
                NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS;
            END IF;
          END
          $$;

          GRANT CONNECT ON DATABASE career_intel_test TO career_intel_app;
          GRANT USAGE ON SCHEMA public TO career_intel_app;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO career_intel_app;
          GRANT USAGE, SELECT ON ALL SEQUENCES IN SCHEMA public TO career_intel_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO career_intel_app;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT USAGE, SELECT ON SEQUENCES TO career_intel_app;
          SQL
      - name: Write .env for dotenv-cli-wrapped scripts
        # packages/db's db:generate/db:migrate and apps/web's test/build/start
        # scripts are wrapped with `dotenv -e ../../.env -- <command>`. CI only
        # sets these as job-level `env:` vars, not a file, so this materializes
        # the same repo-root .env dotenv-cli expects, keeping CI on the exact
        # same code path as local dev instead of relying on dotenv-cli's
        # missing-file fallback behavior.
        run: |
          env | grep -E '^(NODE_ENV|DEFAULT_USER_ID|DATABASE_URL|MIGRATIONS_DATABASE_URL|REDIS_URL|MINIO_ENDPOINT|MINIO_ACCESS_KEY|MINIO_SECRET_KEY|ANTHROPIC_API_KEY|EMBEDDING_PROVIDER|VOYAGE_API_KEY|ANTHROPIC_MODEL_FAST|ANTHROPIC_MODEL_RESEARCH|VOYAGE_EMBEDDING_MODEL)=' > .env
      - name: Apply migrations to the test database once, before any test runs
        # Every suite calls drizzle's migrate() in its own beforeAll, and turbo runs the packages'
        # suites in parallel against this one database. Two simultaneous migrate() calls on an EMPTY
        # database collide creating the same enum ("duplicate key ... pg_type_typname_nsp_index").
        # Migrating here first makes every suite's own migrate() a no-op.
        run: pnpm --filter @ai-career/db db:migrate
      - run: pnpm lint
      # `build` must run before `typecheck`: apps/web's tsc run depends on
      # `LayoutProps` and other ambient types Next.js's typed-routes feature
      # generates into .next/types/ only during `next build`/`next dev`.
      # Locally this is easy to miss because a leftover .next/ from a prior
      # dev/build run masks it -- a fresh CI checkout has no such leftover,
      # so typecheck-before-build fails deterministically on every run.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      # Phase 11d (DECISIONS.md D182): the browser smoke suite against the app built above, the test database,
      # Redis database 1 and local stand-ins for Anthropic and Voyage (no key, no network). Runs in this job so it
      # reuses the services, the app role, .env and the build instead of repeating them.
      - name: Install Chromium for the E2E suite
        run: pnpm --filter @ai-career/e2e exec playwright-core install --with-deps chromium
      - name: E2E smoke suite
        run: pnpm e2e
      - name: Upload E2E logs and screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: e2e/.out/
          if-no-files-found: ignore
      - name: Build the maintenance-worker image (DECISIONS.md D125)
        # Catches a broken Dockerfile. The step above wrote a .env into the build context, so this also
        # proves .dockerignore keeps it (and every other secret) out of the image.
        # The base image comes from public.ecr.aws, not Docker Hub (anonymous Docker Hub token fetches failed
        # here with "connection reset by peer"); the retry absorbs any remaining transient registry errors.
        run: |
          for attempt in 1 2 3; do
            if docker build -f services/maintenance-worker/Dockerfile -t careerpilot-maintenance-worker .; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "docker build failed 3 times" >&2
              exit 1
            fi
            echo "docker build failed (attempt $attempt), retrying in 15s" >&2
            sleep 15
          done
          docker run --rm careerpilot-maintenance-worker node_modules/.bin/tsx --version
          if docker run --rm careerpilot-maintenance-worker sh -c 'find / -name .env -not -path "/proc/*" 2>/dev/null' | grep -q .; then
            echo "A .env file was baked into the image" >&2
            exit 1
          fi
      - name: Build the latex-compiler image and run the real-compile tests (Phase 13c, DECISIONS.md D209)
        # Proves the image builds, pdflatex can typeset every whitelisted character, TeX-looking text stays literal,
        # and the one-page estimate is calibrated. Test mode enables /extract (pdftotext) for the text-layer checks.
        env:
          LATEX_COMPILER_TOKEN: ci-latex-token-0123456789abcdef0123456789
          LATEX_COMPILER_URL: http://127.0.0.1:8090
        run: |
          for attempt in 1 2 3; do
            if docker build -f services/latex-compiler/Dockerfile -t careerpilot-latex-compiler .; then break; fi
            if [ "$attempt" = 3 ]; then echo "docker build failed 3 times" >&2; exit 1; fi
            echo "docker build failed (attempt $attempt), retrying in 15s" >&2; sleep 15
          done
          if docker run --rm careerpilot-latex-compiler sh -c 'find / -name .env -not -path "/proc/*" 2>/dev/null' | grep -q .; then
            echo "A .env file was baked into the image" >&2; exit 1
          fi
          docker run -d --name latex-compiler -p 127.0.0.1:8090:8090 --read-only --tmpfs /tmp:size=64m \
            --cap-drop ALL --security-opt no-new-privileges:true --memory 512m --pids-limit 64 \
            -e LATEX_COMPILER_TOKEN -e LATEX_COMPILER_TEST_MODE=1 careerpilot-latex-compiler
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8090/health && break; sleep 1; done
          pnpm --filter @ai-career/document-export test:latex || { docker logs latex-compiler; exit 1; }
